<div class="profile-menu" data-profile-menu>
  <button
    type="button"
    class="dash-avatar profile-menu-trigger"
    aria-haspopup="menu"
    aria-expanded="false"
    aria-label="Account menu for {{ request.user.get_username }}"
    title="{{ request.user.get_username }}"
  >
    {{ request.user.get_username|slice:":1"|upper }}
  </button>

  <div class="profile-menu-dropdown" role="menu" hidden>
    <a
      class="profile-menu-link"
      href="{% url 'accounts:settings' %}"
      role="menuitem"
      data-loader-message="Opening settings…"
    >
      <span class="profile-menu-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="3.25" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 19.2c1.4-3.1 3.7-4.6 6.5-4.6s5.1 1.5 6.5 4.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </span>
      <span>Profile settings</span>
    </a>

    <form
      method="post"
      action="{% url 'auth:logout' %}"
      class="profile-menu-logout-form"
      data-loader-message="Signing you out…"
    >
      {% csrf_token %}
      <button type="submit" class="profile-menu-link profile-menu-logout" role="menuitem">
        <span class="profile-menu-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M10 4.5H7.5A2.5 2.5 0 0 0 5 7v10a2.5 2.5 0 0 0 2.5 2.5H10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M13.5 12H20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M17.5 8.5 21 12l-3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Logout</span>
      </button>
    </form>
  </div>
</div>
